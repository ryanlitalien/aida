<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aida dashboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --fg: #1f2328;
    --muted: #656d76;
    --bg: #f6f8fa;
    --card: #ffffff;
    --row-alt: #fafbfc;
    --row-hover: #f0f4f8;
    --border: #d8dee4;
    --border-soft: #eaeef2;
    --accent: #2b6cb0;
    --chip-bg: #eef2f6;
    --chip-fg: #334155;
    --banner-err-bg: #fef2f2; --banner-err-fg: #b91c1c; --banner-err-border: #fecaca;
    --banner-warn-bg: #fffbeb; --banner-warn-fg: #92400e; --banner-warn-border: #fde68a;

    /* job/run state chips - mirrors runs_web.html's palette */
    --st-queued-bg: #e5e7eb;            --st-queued-fg: #4b5563;
    --st-running-bg: #ede9fe;           --st-running-fg: #6d28d9;
    --st-awaiting_input-bg: #fef3c7;    --st-awaiting_input-fg: #92400e;
    --st-awaiting_approval-bg: #fee2e2; --st-awaiting_approval-fg: #b91c1c;
    --st-done-bg: #dcfce7;              --st-done-fg: #15803d;
    --st-failed-bg: #fee2e2;            --st-failed-fg: #b91c1c;

    /* fleet reach pills */
    --reach-online-bg: #dcfce7;  --reach-online-fg: #15803d;
    --reach-offline-bg: #fee2e2; --reach-offline-fg: #b91c1c;
    --reach-unknown-bg: #e5e7eb; --reach-unknown-fg: #4b5563;
    --reach-local-bg: #dbeafe;   --reach-local-fg: #1d4ed8;

    /* aida-health pill - "unknown" (null) must look visually distinct
       from "down" (probed, healthz:false) per the API contract. */
    --aida-up-bg: #dcfce7;      --aida-up-fg: #15803d;
    --aida-down-bg: #fee2e2;    --aida-down-fg: #b91c1c;
    --aida-unknown-bg: #eef2f6; --aida-unknown-fg: #6b7280;

    /* Models panel: one hue per provider card, assigned in roster order
       and never cycled (a 9th provider falls back to --accent). Bullet
       track/band/marker inks. */
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948;
    --bullet-track: #ecebe5; --bullet-band: #dedcd3; --bullet-tick: #c9c7be; --bullet-marker: #1f2328;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e6edf3;
      --muted: #8b949e;
      --bg: #0d1117;
      --card: #161b22;
      --row-alt: #1c2128;
      --row-hover: #21262d;
      --border: #30363d;
      --border-soft: #21262d;
      --accent: #58a6ff;
      --chip-bg: #21262d;
      --chip-fg: #c9d1d9;
      --banner-err-bg: #3d1418;  --banner-err-fg: #ff7b72;  --banner-err-border: #5c2226;
      --banner-warn-bg: #3a2e0a; --banner-warn-fg: #e3b341; --banner-warn-border: #5c4813;

      --st-queued-bg: #30363d;            --st-queued-fg: #8b949e;
      --st-running-bg: #3c2e63;           --st-running-fg: #bc8cff;
      --st-awaiting_input-bg: #3a2e0a;    --st-awaiting_input-fg: #e3b341;
      --st-awaiting_approval-bg: #3d1418; --st-awaiting_approval-fg: #ff7b72;
      --st-done-bg: #12261d;              --st-done-fg: #56d364;
      --st-failed-bg: #3d1418;            --st-failed-fg: #ff7b72;

      --reach-online-bg: #12261d;  --reach-online-fg: #56d364;
      --reach-offline-bg: #3d1418; --reach-offline-fg: #ff7b72;
      --reach-unknown-bg: #30363d; --reach-unknown-fg: #8b949e;
      --reach-local-bg: #123152;   --reach-local-fg: #79c0ff;

      --aida-up-bg: #12261d;      --aida-up-fg: #56d364;
      --aida-down-bg: #3d1418;    --aida-down-fg: #ff7b72;
      --aida-unknown-bg: #21262d; --aida-unknown-fg: #8b949e;

      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
      --bullet-track: #21262d; --bullet-band: #30363d; --bullet-tick: #3d444d; --bullet-marker: #e6edf3;
    }
  }
  * { box-sizing: border-box; }
  body {
    font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--fg); background: var(--bg); margin: 0;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  header nav a { color: var(--accent); text-decoration: none; font-weight: 550; }
  header nav a.active { color: var(--fg); cursor: default; }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  main { padding: 16px; display: flex; flex-direction: column; gap: 16px; max-width: 1100px; margin: 0 auto; }

  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px;
  }
  .panel-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;
  }
  .panel-head h2 { font-size: 14px; margin: 0; font-weight: 650; }
  .panel-head .spacer { flex: 1; }

  select, button, input {
    font: inherit; color: var(--fg); background: var(--card);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
  }
  button { cursor: pointer; }
  button:hover { background: var(--row-hover); }
  button:disabled { cursor: wait; opacity: 0.6; }

  .banner {
    padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 12.5px;
    border: 1px solid transparent;
  }
  .banner.err { background: var(--banner-err-bg); color: var(--banner-err-fg); border-color: var(--banner-err-border); }
  .banner.warn { background: var(--banner-warn-bg); color: var(--banner-warn-fg); border-color: var(--banner-warn-border); }

  .chip {
    display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px;
    background: var(--chip-bg); color: var(--chip-fg); font-size: 11px; font-weight: 600;
  }
  .chip.refreshing { background: #ede9fe; color: #6d28d9; }
  .chip.warn { background: var(--banner-warn-bg); color: var(--banner-warn-fg); }

  .pill {
    display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; background: var(--chip-bg); color: var(--chip-fg);
  }
  .pill.reach-online  { background: var(--reach-online-bg);  color: var(--reach-online-fg); }
  .pill.reach-offline { background: var(--reach-offline-bg); color: var(--reach-offline-fg); }
  .pill.reach-unknown { background: var(--reach-unknown-bg); color: var(--reach-unknown-fg); }
  .pill.reach-local   { background: var(--reach-local-bg);   color: var(--reach-local-fg); }

  /* ---- Fleet ---- */
  .dev-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px;
  }
  .dev-card {
    border: 1px solid var(--border-soft); border-radius: 6px; padding: 10px 12px;
    background: var(--row-alt); display: flex; flex-direction: column; gap: 6px;
  }
  .dev-card.stale { opacity: 0.55; }
  .dev-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dev-name { font-weight: 650; }
  .dev-net { font-size: 12px; }
  .aida-cell { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .aida-pill {
    display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
  }
  .aida-pill.up      { background: var(--aida-up-bg);      color: var(--aida-up-fg); }
  .aida-pill.down    { background: var(--aida-down-bg);    color: var(--aida-down-fg); }
  .aida-pill.unknown { background: var(--aida-unknown-bg); color: var(--aida-unknown-fg); }
  .dev-error { color: var(--banner-err-fg); font-size: 12px; }
  .dev-hw { font-size: 11px; }
  .dev-foot { font-size: 11px; }
  .fleet-totals {
    margin-top: 10px; padding: 8px 12px; border-radius: 6px;
    border: 1px dashed var(--border); background: var(--row-alt);
    font-size: 12px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
  }
  .fleet-totals-label { font-weight: 650; }

  /* ---- Jobs strip ---- */
  .job-counts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .job-counts .chip[class*="state-"] { background: var(--chip-bg); color: var(--chip-fg); }
  .job-counts .chip.state-queued            { background: var(--st-queued-bg);            color: var(--st-queued-fg); }
  .job-counts .chip.state-running           { background: var(--st-running-bg);           color: var(--st-running-fg); }
  .job-counts .chip.state-awaiting_input    { background: var(--st-awaiting_input-bg);    color: var(--st-awaiting_input-fg); }
  .job-counts .chip.state-awaiting_approval { background: var(--st-awaiting_approval-bg); color: var(--st-awaiting_approval-fg); }
  .job-counts .chip.state-done              { background: var(--st-done-bg);              color: var(--st-done-fg); }
  .job-counts .chip.state-failed            { background: var(--st-failed-bg);            color: var(--st-failed-fg); }

  ul.job-list { list-style: none; margin: 0; padding: 0; }
  .job-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .job-row:last-child { border-bottom: none; }
  .job-row .handle { font-weight: 600; }
  .job-row .job-age { margin-left: auto; font-size: 11px; }
  .job-row .chip.state-queued            { background: var(--st-queued-bg);            color: var(--st-queued-fg); }
  .job-row .chip.state-running           { background: var(--st-running-bg);           color: var(--st-running-fg); }
  .job-row .chip.state-awaiting_input    { background: var(--st-awaiting_input-bg);    color: var(--st-awaiting_input-fg); }
  .job-row .chip.state-awaiting_approval { background: var(--st-awaiting_approval-bg); color: var(--st-awaiting_approval-fg); }
  .job-row .chip.state-done              { background: var(--st-done-bg);              color: var(--st-done-fg); }
  .job-row .chip.state-failed            { background: var(--st-failed-bg);            color: var(--st-failed-fg); }

  /* ---- Brain ---- */
  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px;
    margin-bottom: 8px;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-n { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat-n.on  { color: var(--st-done-fg); }
  .stat-n.off { color: var(--muted); }
  .stat-l { font-size: 11px; color: var(--muted); }
  .brain-foot { font-size: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* ---- Flow ---- */
  ul.flow-list { list-style: none; margin: 0 0 10px; padding: 0; }
  .flow-row {
    display: flex; align-items: center; gap: 10px; padding: 6px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .flow-row:last-child { border-bottom: none; }
  .flow-row.dim { opacity: 0.5; }
  .flow-kind {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); width: 46px; flex: none;
  }
  .flow-label { font-weight: 550; min-width: 0; }
  .flow-count { margin-left: auto; font-variant-numeric: tabular-nums; }
  .flow-p50 { font-size: 11px; white-space: nowrap; }
  .flow-unmeasured { margin-left: auto; font-size: 11px; font-style: italic; }
  .flow-totals { font-size: 12px; }

  .empty { color: var(--muted); padding: 20px 0; text-align: center; }

  /* ---- Models ---- */
  .model-providers { display: flex; flex-direction: column; gap: 10px; }
  .model-card {
    border: 1px solid var(--border-soft); border-radius: 6px; padding: 10px 12px;
    background: var(--row-alt);
  }
  .model-card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .model-label { font-weight: 650; }
  .model-bars, .model-spend { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
  .bar-row {
    display: grid; grid-template-columns: 92px 1fr 150px; align-items: center; gap: 10px;
    font-size: 12px; padding: 3px 0;
  }
  .bar-row.wk { padding-bottom: 13px; }
  .bar-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Bullet bar: a flat track, a shaded 90%+ zone at the far end, a thin
     fill in the provider's hue, day ticks (7-day windows only) and a pace
     marker showing how far through the window the clock is, so fill left
     of the marker reads as "under pace" at a glance. */
  .bar-track {
    position: relative; height: 14px; border-radius: 2px; background: var(--bullet-track);
  }
  .bar-band {
    position: absolute; left: 90%; right: 0; top: 0; bottom: 0;
    background: var(--bullet-band); border-radius: 0 2px 2px 0; pointer-events: none;
  }
  .bar-fill {
    position: absolute; left: 0; top: 3px; height: 8px; border-radius: 0 3px 3px 0;
    background: var(--pc, var(--accent)); pointer-events: none;
  }
  .bar-fill.zero { width: 2px; opacity: .45; }
  .bar-day { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--bullet-tick); pointer-events: none; }
  .bar-day.lab {
    background: transparent; width: auto; top: 100%; transform: translateX(-50%);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; color: var(--muted); line-height: 1.5;
  }
  .bar-tick {
    position: absolute; top: -3px; width: 2px; height: 20px; border-radius: 1px;
    background: var(--bullet-marker); pointer-events: none;
  }
  .bar-tick::after {
    content: ""; position: absolute; left: -4px; top: -5px;
    border: 5px solid transparent; border-top-color: var(--bullet-marker);
  }
  .bar-meta {
    display: flex; gap: 8px; align-items: baseline; justify-content: flex-end;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .bar-pct {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; font-size: 13px;
    color: var(--fg); min-width: 34px; text-align: right;
  }
  .bar-pct.hot { color: var(--banner-err-fg); }
  .bar-amt { min-width: 0; }
  .bar-scale { display: grid; grid-template-columns: 92px 1fr 150px; gap: 10px; margin-top: 6px; }
  .bar-scale div { position: relative; height: 14px; }
  .bar-scale span {
    position: absolute; transform: translateX(-50%);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; color: var(--muted);
  }
  .bar-key { font-size: 12px; color: var(--muted); margin: 8px 0 2px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .bar-key i { display: inline-block; width: 2px; height: 12px; background: var(--bullet-marker); vertical-align: -2px; margin-right: 6px; }
  .bar-key em { display: inline-block; width: 14px; height: 10px; background: var(--bullet-band); vertical-align: -1px; margin-right: 6px; }
  .model-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--pc, var(--accent)); flex: none; }
  @media (max-width: 560px) {
    .bar-row, .bar-scale { grid-template-columns: 72px 1fr 118px; gap: 6px; }
    .bar-meta { font-size: 11px; }
  }
  .pace-chip { font-weight: 650; }
  .pace-hot  { color: var(--banner-err-fg); }
  .pace-idle { color: var(--accent); }
  .pace-on   { color: var(--muted); }
  .pace-strip {
    font-size: 12px; margin: -2px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .model-list { font-size: 12px; margin-top: 4px; }
  .model-unlisted { font-size: 12px; margin-top: 4px; }
  .model-warn { color: var(--banner-warn-fg); font-size: 12px; margin-top: 4px; }
  .model-guidance {
    list-style: disc; margin: 10px 0 0 18px; padding: 0; font-size: 12px; color: var(--muted);
  }
  .model-guidance li { margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <h1>Aida dashboard</h1>
  <nav>
    <a href="/">Jarvis</a> &middot;
    <a href="/tasks">Tasks</a> &middot;
    <a href="/runs">Runs</a> &middot;
    <a class="active">Dashboard</a> &middot;
    <a href="/bifrost">Bifrost</a> &middot;
    <a href="/menu">Menu</a> &middot;
    <a href="/habits">Habits</a>
  </nav>
</header>

<main id="app"></main>

<script type="module">
import { reactive, html } from '/static/arrow/index.mjs';

const state = reactive({
  fleet: null,
  fleetErr: '',
  fleetBusy: false,
  runsData: null,
  runsErr: '',
  brain: null,
  brainErr: '',
  flow: null,
  flowErr: '',
  models: null,
  modelsErr: '',
  modelsBusy: false,
});

// ---- helpers ----

function ago(ts) {
  if (!ts) return '';
  const t = Date.parse(ts);
  if (isNaN(t)) return '';
  // Go marshals an unset time.Time as "0001-01-01T00:00:00Z", which parses
  // cleanly and renders as ~739817d. Any timestamp before the Unix epoch is
  // a zero value, not a real observation -- say so instead.
  if (t < 0) return 'never';
  const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

function humanBytes(n) {
  if (n === null || n === undefined) return ' - ';
  if (n < 1024) return n + ' B';
  const units = ['KB', 'MB', 'GB', 'TB'];
  let v = n, u = -1;
  do { v /= 1024; u++; } while (v >= 1024 && u < units.length - 1);
  return v.toFixed(v < 10 ? 1 : 0) + ' ' + units[u];
}

// ---- data loading ----

async function loadFleet() {
  try {
    const r = await fetch('/api/fleet');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    state.fleet = await r.json();
    state.fleetErr = '';
  } catch (e) {
    state.fleetErr = 'Failed to load fleet: ' + e.message;
  }
}

async function refreshFleet() {
  if (state.fleetBusy) return;
  state.fleetBusy = true;
  try {
    const r = await fetch('/api/fleet/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    await loadFleet();
  } catch (e) {
    state.fleetErr = 'Refresh failed: ' + e.message;
  } finally {
    state.fleetBusy = false;
  }
}

async function loadRuns() {
  try {
    const r = await fetch('/api/runs?state=active&limit=20');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    state.runsData = await r.json();
    state.runsErr = '';
  } catch (e) {
    state.runsErr = 'Failed to load runs: ' + e.message;
  }
}

async function loadBrain() {
  try {
    const r = await fetch('/api/brain/stats');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    state.brain = await r.json();
    state.brainErr = '';
  } catch (e) {
    state.brainErr = 'Failed to load brain stats: ' + e.message;
  }
}

async function loadFlow() {
  try {
    const r = await fetch('/api/dashboard/flow?window=24h&limit=200');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    state.flow = await r.json();
    state.flowErr = '';
  } catch (e) {
    state.flowErr = 'Failed to load flow: ' + e.message;
  }
}

async function loadModels() {
  try {
    const r = await fetch('/api/models');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    state.models = await r.json();
    state.modelsErr = '';
  } catch (e) {
    state.modelsErr = 'Failed to load models: ' + e.message;
  }
}

async function refreshModels() {
  if (state.modelsBusy) return;
  state.modelsBusy = true;
  try {
    const r = await fetch('/api/models/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    await loadModels();
  } catch (e) {
    state.modelsErr = 'Refresh failed: ' + e.message;
  } finally {
    state.modelsBusy = false;
  }
}

// ---- Fleet ----

function aidaFragment(d) {
  if (d.aida === null || d.aida === undefined) {
    // Deliberately distinct from "down": we never got an answer at all.
    return html`<div class="aida-cell"><span class="aida-pill unknown">not probed</span></div>`;
  }
  const a = d.aida;
  const cls = a.healthz ? 'aida-pill up' : 'aida-pill down';
  const label = a.healthz ? 'healthy' : 'down';
  const extra = [a.version ? 'v' + a.version : '', a.uptime || ''].filter(Boolean).join(' · ');
  return html`
    <div class="aida-cell">
      <span class="${cls}">${label}</span>
      ${() => (extra ? html`<span class="muted">${extra}</span>` : '')}
    </div>
  `;
}

// hardwareFragment renders the CPU · RAM · GPU (VRAM) · disk-free spec row
// from d.hardware. Nil (unprobed/unreachable, or a probe: tailscale-only
// / none device -- hardware is only ever collected for ssh/local) renders
// nothing rather than an empty row, matching aidaFragment's null handling
// above.
function hardwareFragment(d) {
  const hw = d.hardware;
  if (!hw) return '';
  const parts = [];
  if (hw.cpu) parts.push(hw.cpu);
  if (hw.mem) parts.push(hw.mem + ' RAM');
  if (hw.gpu) parts.push(hw.gpu);
  if (hw.disk) parts.push(hw.disk + ' free');
  if (!parts.length) return '';
  return html`<div class="dev-hw muted">${parts.join(' · ')}</div>`;
}

// Arrow gotcha, learned the hard way -- see the ${() => ...} wrappers below.
//
// Inside a KEYED template, Arrow reuses the existing DOM chunk when the item
// re-renders. Plain text and attribute interpolations are re-evaluated on
// that path and update fine. A NESTED TEMPLATE in a static expression
// position is not: it renders once and then goes stale, and if its value
// changes from '' to a template it is stringified into the page as
// "(el) => renderTemplate(template, el)".
//
// So every expression here that produces a template -- inline `html` or a
// call to a function returning one -- must be a () => arrow so Arrow treats
// it as reactive. Plain values do not need it.
function deviceCard(d) {
  const reach = d.reach || 'unknown';
  const cardClass = d.stale ? 'dev-card stale' : 'dev-card';
  const reachClass = 'pill reach-' + reach;
  const netText = d.tailscale_ip
    ? d.tailscale_ip + (d.tailscale_os ? ' · ' + d.tailscale_os : '')
    : 'no tailscale info';
  const foot = 'probed ' + (ago(d.probed_at) || '?') + ' ago' +
    (d.probe_took_ms ? ' · ' + d.probe_took_ms + 'ms' : '');
  return html`
    <article class="${cardClass}">
      <div class="dev-top">
        <span class="dev-name">${d.name}</span>
        ${() => (d.role ? html`<span class="chip">${d.role}</span>` : '')}
        <span class="${reachClass}">${reach}</span>
      </div>
      <div class="dev-net muted">${netText}</div>
      ${() => aidaFragment(d)}
      ${() => hardwareFragment(d)}
      ${() => (d.error ? html`<div class="dev-error">${d.error}</div>` : '')}
      <div class="dev-foot muted">${foot}</div>
    </article>
  `.key(d.name);
}

// fleetTotalsCard renders the fleet-wide hardware summary from
// state.fleet.totals (fleet.FleetTotals, JSON-serialized): total physical
// machines, CPU cores, RAM, GPU VRAM, and disk free/total. The server
// already excludes "-wsl" sub-nodes like beast-wsl from these sums (same
// physical CPU/GPU as their host, would double-count) -- this just
// displays what it's given, no client-side math. Renders nothing before
// the first snapshot lands, or if there are no devices at all.
function fleetTotalsCard() {
  const t = state.fleet && state.fleet.totals;
  if (!t || !t.machines) return '';
  const parts = [t.machines + (t.machines === 1 ? ' machine' : ' machines')];
  if (t.cores) parts.push(t.cores + ' cores');
  if (t.mem_gb) parts.push(Math.round(t.mem_gb) + 'GB RAM');
  if (t.gpu_gb) parts.push(Math.round(t.gpu_gb) + 'GB VRAM');
  if (t.disk_total_gb) parts.push(Math.round(t.disk_free_gb) + 'GB free of ' + Math.round(t.disk_total_gb) + 'GB disk');
  return html`
    <div class="fleet-totals">
      <span class="fleet-totals-label">Fleet totals</span>
      <span class="muted">${parts.join(' · ')}</span>
    </div>
  `;
}

// ---- Models ----

// roundPricesForDisplay mirrors internal/models.RoundPricesForDisplay
// (Go): a price ending in .99 rounds up to the next whole dollar
// ("$19.99" -> "$20", "$74.99/mo" -> "$75/mo"), and a price already at a
// whole-dollar amount drops its trailing ".00" ("$75.00" -> "$75").
// Anything else ("$32.81") is left as-is. Render-time only -- never
// mutates state.models, just what this page prints.
function roundPricesForDisplay(s) {
  if (!s) return s;
  return String(s).replace(/\$(\d+)\.(\d{2})/g, (match, whole, cents) => {
    let w = parseInt(whole, 10);
    let c = parseInt(cents, 10);
    if (c === 99) { w += 1; c = 0; }
    if (c === 0) return '$' + w;
    return match;
  });
}

// resetDate renders a Spend row's resets_at as a short local date, e.g.
// "resets Oct 1" -- mirroring the CLI's formatResetsDate. Empty for a
// zero/missing timestamp rather than a bogus date.
function resetDate(iso) {
  if (!iso) return '';
  const t = Date.parse(iso);
  if (isNaN(t) || t < 0) return '';
  return 'resets ' + new Date(t).toLocaleDateString([], { month: 'short', day: 'numeric' });
}

// pacedPace returns b/s.pace when it carries an actual verdict worth
// showing -- a chip/tick is never rendered for a null Pace (no window,
// too short a window, no reset time) or an "early" one (too little of
// the window has elapsed for pace to mean anything yet); both render
// the same plain used/left text unpaced rows always have.
function pacedPace(pace) {
  return pace && pace.verdict !== 'early' ? pace : null;
}

// paceClass/paceChipText mirror internal/models.FormatPaceChip (Go) and
// its verdict->CSS-class mapping: the compact token shown next to a
// paced row's used%, and the class that colors it.
function paceClass(verdict) {
  if (verdict === 'hot') return 'pace-hot';
  if (verdict === 'idle') return 'pace-idle';
  if (verdict === 'on-pace') return 'pace-on';
  return '';
}

function paceChipText(pace) {
  if (pace.verdict === 'hot') return pace.ratio.toFixed(1) + 'x HOT';
  if (pace.verdict === 'idle') return pace.ratio.toFixed(1) + 'x IDLE';
  if (pace.verdict === 'on-pace') return 'on pace';
  return '';
}

// resetAbs renders a Bar's resets_at as a short local absolute time,
// "Fri 2:00pm" (weekday + clock in the browser's timezone), the form the
// bullet rows' meta column uses. Go's zero time ("0001-01-01T00:00:00Z")
// or a missing value renders as "idle" (the window has nothing to reset).
function resetAbs(iso) {
  if (!iso) return 'idle';
  const t = Date.parse(iso);
  if (isNaN(t) || t < 0) return 'idle';
  const d = new Date(t);
  if (d.getFullYear() < 1900) return 'idle';
  const wd = d.toLocaleDateString([], { weekday: 'short' });
  const tm = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(' ', '').toLowerCase();
  return wd + ' ' + tm;
}

// paceTitle is the tooltip on a bullet's track: the ratio/verdict chip
// text plus its detail, demoted from the meta column so the row stays
// "NN%  resets <when>" at a glance.
function paceTitle(label, pct, pace, resetText) {
  const paced = pacedPace(pace);
  let t = label + ': ' + Math.round(pct) + '% used, resets ' + resetText;
  if (paced) t += ' · ' + paceChipText(paced) + (paced.detail ? ' · ' + paced.detail : '');
  return t;
}

// windowElapsedFraction computes how far through a reset window the clock
// is right now, purely from resetsAt + windowMins, for bars that carry no
// Pace verdict (e.g. a 5-hour bar, or a 7-day bar sitting at 0% usage).
// Returns null when resetsAt is missing/unparseable/zero-time or windowMins
// is not a positive window, so the caller can fall back to no marker.
function windowElapsedFraction(resetsAt, windowMins) {
  if (!resetsAt || !windowMins || windowMins <= 0) return null;
  const resetMs = Date.parse(resetsAt);
  if (isNaN(resetMs) || resetMs < 0) return null;
  if (new Date(resetMs).getFullYear() < 1900) return null;
  const windowMs = windowMins * 60 * 1000;
  return Math.max(0, Math.min(1, 1 - (resetMs - Date.now()) / windowMs));
}

// bulletTrack builds the shared track markup: 90%+ band, six day ticks
// (labeled d1..d6) when the window is exactly 7 days, the fill, and the
// pace marker at how far through the window the clock is. The marker
// prefers pace.elapsed when a real pace verdict exists, and otherwise
// falls back to computing elapsed fraction from resetsAt + windowMins
// directly, so every bar with a valid reset time gets a marker.
function bulletTrack(pct, windowMins, pace, title, resetsAt) {
  const paced = pacedPace(pace);
  const elapsed = paced ? paced.elapsed : windowElapsedFraction(resetsAt, windowMins);
  const tickPct = elapsed === null ? null : Math.max(0, Math.min(100, elapsed * 100));
  const weekly = Math.round(windowMins || 0) === 10080;
  const days = weekly ? [1, 2, 3, 4, 5, 6] : [];
  return html`
    <div class="bar-track" title="${title}">
      <span class="bar-band"></span>
      ${days.map(d => html`<span class="bar-day" style="${'left:' + (d * 100 / 7).toFixed(2) + '%'}"></span>`.key('t' + d))}
      <span class="${'bar-fill' + (pct <= 0 ? ' zero' : '')}" style="${'width:' + pct + '%'}"></span>
      ${days.map(d => html`<span class="bar-day lab" style="${'left:' + (d * 100 / 7).toFixed(2) + '%'}">d${d}</span>`.key('l' + d))}
      ${tickPct === null ? '' : html`<span class="bar-tick" style="${'left:calc(' + tickPct + '% - 1px)'}"></span>`}
    </div>
  `;
}

function modelBarRow(b) {
  const pct = Math.max(0, Math.min(100, b.percent ?? 0));
  const weekly = Math.round(b.window_mins || 0) === 10080;
  const resetText = resetAbs(b.resets_at);
  return html`
    <div class="${'bar-row' + (weekly ? ' wk' : '')}">
      <span class="bar-label">${b.label}</span>
      ${bulletTrack(pct, b.window_mins, b.pace, paceTitle(b.label, pct, b.pace, resetText), b.resets_at)}
      <span class="bar-meta muted"><b class="${'bar-pct' + (pct >= 90 ? ' hot' : '')}">${Math.round(pct)}%</b><span>resets ${resetText}</span></span>
    </div>
  `.key(b.label);
}

function modelSpendRow(s) {
  const budget = s.budget || 0;
  const pct = budget > 0 ? Math.max(0, Math.min(100, (s.spend / budget) * 100)) : 0;
  const amounts = roundPricesForDisplay('$' + (s.spend ?? 0).toFixed(2) + ' / $' + budget.toFixed(2));
  const resetText = resetDate(s.resets_at) || '';
  const title = s.key + ': ' + amounts + (resetText ? ', ' + resetText : '')
    + (pacedPace(s.pace) ? ' · ' + paceChipText(s.pace) + (s.pace.detail ? ' · ' + s.pace.detail : '') : '');
  return html`
    <div class="bar-row">
      <span class="bar-label">${s.key}</span>
      ${bulletTrack(pct, s.window_mins, s.pace, title, s.resets_at)}
      <span class="bar-meta muted"><b class="${'bar-pct' + (pct >= 90 ? ' hot' : '')}">${Math.round(pct)}%</b><span class="bar-amt">${amounts}${resetText ? ' · ' + resetText : ''}</span></span>
    </div>
  `.key(s.key);
}

// ---- Pace exception strip: which bars/spend rows across every provider
// are off-pace right now, one line, so a glance at the panel header
// answers "is anything burning hot or sitting idle" without reading
// every card. ----

function collectPaceExceptions(providers) {
  const hot = [];
  const idle = [];
  for (const p of providers) {
    const usage = p.usage || {};
    for (const b of (usage.bars || [])) {
      if (b.pace && b.pace.verdict === 'hot') hot.push(p.label + ' ' + b.label);
      else if (b.pace && b.pace.verdict === 'idle') idle.push(p.label + ' ' + b.label);
    }
    for (const s of (usage.spend || [])) {
      if (s.pace && s.pace.verdict === 'hot') hot.push(p.label + ' ' + s.key);
      else if (s.pace && s.pace.verdict === 'idle') idle.push(p.label + ' ' + s.key);
    }
  }
  return { hot, idle };
}

function paceExceptionStrip(providers) {
  const { hot, idle } = collectPaceExceptions(providers);
  if (!hot.length && !idle.length) return '';
  const hotPart = hot.length ? html`<span class="pace-hot">HOT:</span> ${hot.join(', ')}` : '';
  const sep = (hot.length && idle.length) ? '   ' : '';
  const idlePart = idle.length ? html`<span class="pace-idle">IDLE:</span> ${idle.join(', ')}` : '';
  return html`<div class="pace-strip">${hotPart}${sep}${idlePart}</div>`;
}

function modelsList(ms) {
  if (!ms || !ms.length) return '';
  return ms.map(m => (m.nicknames && m.nicknames.length ? m.nicknames[0] : m.id) + ' (' + m.id + ')').join(', ');
}

function modelProviderCard(p, idx) {
  const usage = p.usage || {};
  const bars = usage.bars || [];
  const spend = usage.spend || [];
  const unlisted = (usage.detail && usage.detail.unlisted_models) || '';
  const resetCredits = parseInt((usage.detail && usage.detail.reset_credits) || '0', 10) || 0;
  const usageCredits = (usage.detail && usage.detail.usage_credits) || '';
  const sevenDayBreakdown = (usage.detail && usage.detail.seven_day_breakdown) || '';
  const hue = idx < 8 ? 'var(--series-' + (idx + 1) + ')' : 'var(--accent)';
  return html`
    <article class="model-card" style="${'--pc:' + hue}">
      <div class="model-card-head">
        <span class="model-dot"></span>
        <span class="model-label">${p.label}</span>
        ${() => (p.plan || usage.plan ? html`<span class="chip">${roundPricesForDisplay(usage.plan || p.plan)}</span>` : '')}
        ${() => (p.account ? html`<span class="muted">${p.account}</span>` : '')}
      </div>
      ${() => (bars.length ? html`<div class="model-bars">${bars.map(b => modelBarRow(b))}</div>` : '')}
      ${() => (spend.length ? html`<div class="model-spend">${spend.map(s => modelSpendRow(s))}</div>` : '')}
      ${() => (p.models && p.models.length ? html`<div class="model-list muted">models: ${modelsList(p.models)}</div>` : '')}
      ${() => (unlisted ? html`<div class="model-unlisted muted">unlisted locally, not in roster: ${unlisted}</div>` : '')}
      ${() => (resetCredits > 0 ? html`<div class="model-list muted">reset credits: ${resetCredits} free full resets available</div>` : '')}
      ${() => (usageCredits ? html`<div class="model-list muted">${usageCredits}</div>` : '')}
      ${() => (sevenDayBreakdown ? html`<div class="model-list muted">${sevenDayBreakdown}</div>` : '')}
      ${() => (usage.warn ? html`<div class="model-warn">usage: ${usage.warn}</div>` : (usage.err ? html`<div class="dev-error">usage: ${usage.err}</div>` : ''))}
    </article>
  `.key(p.name);
}

function modelsSection() {
  return html`
    <section class="panel">
      <div class="panel-head">
        <h2>Models</h2>
        <span class="muted">${() => (state.models && state.models.updated) ? 'roster updated ' + state.models.updated : ''}</span>

        <div class="bar-key"><span><i></i>marker = how far through the window the clock is (fill left of it means under pace)</span><span>ticks on 7-day bars = one day each</span><span><em></em>90%+ zone</span></div>
      ` : ''}

        return html`<ul class="model-guidance">${guidance.map(g => html`<li>${g}</li>`.key(g))}</ul>`;
      }}
    </section>
  `;
}

// ---- Polling: one setInterval per cadence, all paused while the tab is
// hidden so a backgrounded dashboard doesn't hammer ssh probes. ----
loadFleet();
loadRuns();
loadBrain();
loadFlow();
loadModels();
setInterval(() => { if (!document.hidden) loadFleet(); }, 10000);
setInterval(() => { if (!document.hidden) loadRuns(); }, 5000);
setInterval(() => { if (!document.hidden) loadBrain(); }, 30000);
setInterval(() => { if (!document.hidden) loadFlow(); }, 30000);
// GET /api/models is itself cached server-side for 60s (see
// modelsCacheTTL in models_web.go), so polling every 30s here mostly
// hits that cache rather than re-running keychain/ssh/network probes.
setInterval(() => { if (!document.hidden) loadModels(); }, 30000);

// The polls above are gated on document.hidden so a forgotten background
// tab does not keep firing ssh probes at the fleet. The cost of that is
// stale data on return, so refresh once immediately when the tab becomes
// visible rather than making the user wait out the next interval.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  loadBrain();
  loadFleet();
  loadFlow();
  loadRuns();
  loadModels();
});
</script>
</body>
</html>
