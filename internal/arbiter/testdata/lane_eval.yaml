# Routing eval fixtures for TestPickEval (pick_eval_test.go). Each case
# runs Pick(arbiter.DefaultConfig(), ...) against a synthetic capacity
# snapshot and signal set, and asserts the winning lane/model or ErrNoLane.
# Adding a routing scenario is a one-line addition to this file, not a new
# Go test function.
#
# Cases (a)-(l) below are seeded from docs/research/model-usage-burndown/
# routing-examples.txt and lanes.yaml, per the build brief. Lane ids and
# provider labels were renamed 2026-09-25 to match DefaultConfig's
# placeholder roster (claude-max -> claude-personal, claude-pro-bs ->
# claude-company, gemini-agy -> gemini, codex-plus -> codex, qwen-ec2 ->
# proxy-model). The same day, gemini's Roles: [thinker] restriction was
# dropped (it now serves every role, re-testing the 2026-09-08 Flash
# benchmark), which changes what (c) and (k) exercise: (c) now shows
# gemini rejected on headroom rather than role, and (k) -- previously
# "executor never lands on the thinker-only gemini lane" -- flips to show
# executor landing on gemini once nothing else has room.
cases:
  # (a) Example 1: personal task, the personal lane has headroom on both
  # windows.
  - name: "personal task picks claude-personal when it has headroom"
    tags: ["project:aida"]
    role: executor
    now: "2026-09-24T10:00:00Z"
    capacity:
      - provider: "Anthropic / Claude"
        label: "5-hour"
        used_pct: 2
        left_pct: 98
        headroom: 90
      - provider: "Anthropic / Claude"
        label: "7-day"
        used_pct: 2
        left_pct: 98
        headroom: 90
    expect_lane: claude-personal
    expect_model: claude-sonnet-5

  # (b) Example 2: butterstack task. claude-personal is plentiful but
  # forbidden by data class; the company seat is the one allowed to see
  # it.
  - name: "butterstack task skips claude-personal on data class, uses claude-company"
    tags: ["project:butterstack"]
    role: executor
    now: "2026-09-24T10:00:00Z"
    capacity:
      - provider: "Anthropic / Claude"
        label: "5-hour"
        used_pct: 2
        left_pct: 98
        headroom: 90
      - provider: "Anthropic / Claude"
        label: "7-day"
        used_pct: 2
        left_pct: 98
        headroom: 90
      - provider: "Anthropic / Claude (company seat)"
        label: "5-hour"
        used_pct: 5
        left_pct: 95
        headroom: 90
      - provider: "Anthropic / Claude (company seat)"
        label: "7-day"
        used_pct: 32
        left_pct: 68
        floor: 15
        headroom: 53
    expect_lane: claude-company
    expect_model: claude-sonnet-5
    expect_rejected_contains: ["claude-personal", "data class"]

  # (c) Example 3: games task. claude-personal is out of headroom on its
  # 5-hour window, gemini is tight on its 5-hour window too (any window
  # failing rejects the whole lane, same rule as (f)), codex has a fresh
  # window. gemini serves executor now (decision 2026-09-25), so this
  # case exercises the headroom rejection instead of a role rejection.
  - name: "games task falls past exhausted claude-personal and tight-on-headroom gemini to codex"
    tags: ["project:plt"]
    role: executor
    now: "2026-09-24T10:00:00Z"
    capacity:
      - provider: "Anthropic / Claude"
        label: "5-hour"
        used_pct: 100
        left_pct: 0
        headroom: 0
      - provider: "Anthropic / Claude"
        label: "7-day"
        used_pct: 2
        left_pct: 98
        headroom: 90
      - provider: "Google / Gemini"
        label: "5-hour"
        used_pct: 97
        left_pct: 3
        headroom: 3
      - provider: "Google / Gemini"
        label: "7-day"
        used_pct: 0
        left_pct: 100
        headroom: 95
      - provider: "OpenAI / ChatGPT + Codex"
        label: "5-hour"
        used_pct: 0
        left_pct: 100
        headroom: 95
      - provider: "OpenAI / ChatGPT + Codex"
        label: "7-day"
        used_pct: 0
        left_pct: 100
        headroom: 95
    expect_lane: codex
    expect_model: gpt-5.6-terra
    expect_rejected_contains: ["claude-personal", "gemini", "headroom"]

  # (d) Personal task, claude-personal/gemini/codex all signalled empty,
  # litellm rich: personal data never lands on litellm regardless of how
  # much headroom it has, because litellm's data_classes allowlist
  # doesn't include personal. gemini must be signalled empty too now that
  # it serves executor (decision 2026-09-25) -- otherwise it would win
  # this case outright instead of exercising the litellm rejection.
  - name: "personal task never falls through to litellm even when it is the only lane with room"
    tags: ["personal"]
    role: executor
    now: "2026-09-24T10:00:00Z"
    signals:
      claude-personal: "2026-09-24T15:00:00Z"
      gemini: "2026-09-24T15:00:00Z"
      codex: "2026-09-24T15:00:00Z"
    capacity:
      - provider: "Google / Gemini"
        label: "5-hour"
        used_pct: 0
        headroom: 95
      - provider: "Google / Gemini"
        label: "7-day"
        used_pct: 0
        headroom: 95
      - provider: "LiteLLM proxy"
        label: "spend"
        used_pct: 1
        headroom: 95
        is_spend: true
    expect_no_lane: true
    expect_rejected_contains: ["litellm", "data class"]

  # (e) Butterstack task, the company seat is signalled empty: falls to
  # the unprobed proxy-model lane, the only other lane allowed to see
  # butterstack data with allow_unprobed set.
  - name: "butterstack task falls to proxy-model when claude-company is signalled empty"
    tags: ["butterstack"]
    role: executor
    now: "2026-09-24T10:00:00Z"
    signals:
      claude-company: "2026-09-24T15:00:00Z"
    capacity: []
    expect_lane: proxy-model
    expect_model: qwen
    expect_rejected_contains: ["claude-company", "signalled empty until"]

  # (f) claude-personal's 5-hour window is below the default 5% min
  # headroom even though its 7-day window is fine -- ANY window failing
  # rejects the whole lane, so it falls through (gemini is skipped on
  # role) to codex.
  - name: "claude-personal rejected on a single tight window even though its other window is fine"
    tags: ["personal"]
    role: executor
    now: "2026-09-24T10:00:00Z"
    capacity:
      - provider: "Anthropic / Claude"
        label: "5-hour"
        used_pct: 97
        left_pct: 3
        headroom: 3
      - provider: "Anthropic / Claude"
        label: "7-day"
        used_pct: 2
        left_pct: 98
        headroom: 90
      - provider: "OpenAI / ChatGPT + Codex"
        label: "5-hour"
        used_pct: 0
        headroom: 95
      - provider: "OpenAI / ChatGPT + Codex"
        label: "7-day"
        used_pct: 0
        headroom: 95
    expect_lane: codex
    expect_model: gpt-5.6-terra
    expect_rejected_contains: ["claude-personal", "headroom"]

  # (g) A stray Fable 7-day row for the Claude provider must never block
  # claude-personal, since "7d-fable" isn't one of its configured windows.
  - name: "an unrelated Fable window on the same provider never blocks the lane"
    tags: ["personal"]
    role: executor
    now: "2026-09-24T10:00:00Z"
    capacity:
      - provider: "Anthropic / Claude"
        label: "5-hour"
        used_pct: 2
        headroom: 90
      - provider: "Anthropic / Claude"
        label: "7-day"
        used_pct: 2
        headroom: 90
      - provider: "Anthropic / Claude"
        label: "7-day (Fable)"
        used_pct: 99
        headroom: 0
    expect_lane: claude-personal
    expect_model: claude-sonnet-5

  # (h) Thinker role on a personal task picks claude-personal's thinker
  # model.
  - name: "thinker role on a personal task uses claude-personal's thinker model"
    tags: ["personal"]
    role: thinker
    now: "2026-09-24T10:00:00Z"
    capacity:
      - provider: "Anthropic / Claude"
        label: "5-hour"
        used_pct: 2
        headroom: 90
      - provider: "Anthropic / Claude"
        label: "7-day"
        used_pct: 2
        headroom: 90
    expect_lane: claude-personal
    expect_model: claude-opus-5

  # (i) An ambiguous (fail-open) signal on claude-personal is
  # indistinguishable from an outright empty one to Pick -- it's skipped
  # the same way.
  - name: "an ambiguous-signalled lane is skipped like an empty one"
    tags: ["personal"]
    role: executor
    now: "2026-09-24T10:00:00Z"
    signals:
      claude-personal: "2026-09-24T11:00:00Z"
    capacity:
      - provider: "OpenAI / ChatGPT + Codex"
        label: "5-hour"
        used_pct: 0
        headroom: 95
      - provider: "OpenAI / ChatGPT + Codex"
        label: "7-day"
        used_pct: 0
        headroom: 95
    expect_lane: codex
    expect_model: gpt-5.6-terra
    expect_rejected_contains: ["claude-personal", "signalled empty until"]

  # (j) claude-personal's 7-day window has no live row at all (only
  # 5-hour was probed) -- a specific "missing window" reason, not a
  # blanket "unprobed", since the provider clearly was probed.
  - name: "claude-personal missing its 7-day row falls through to codex"
    tags: ["personal"]
    role: executor
    now: "2026-09-24T10:00:00Z"
    capacity:
      - provider: "Anthropic / Claude"
        label: "5-hour"
        used_pct: 2
        headroom: 90
      - provider: "OpenAI / ChatGPT + Codex"
        label: "5-hour"
        used_pct: 0
        headroom: 95
      - provider: "OpenAI / ChatGPT + Codex"
        label: "7-day"
        used_pct: 0
        headroom: 95
    expect_lane: codex
    expect_model: gpt-5.6-terra
    expect_rejected_contains: ["claude-personal", "missing window 7d"]

  # (k) gemini is the only lane with headroom, and (decision 2026-09-25)
  # it now serves every role, so executor lands there instead of ErrNoLane.
  # Was "executor role never lands on the thinker-only gemini lane" before
  # the Roles: [thinker] restriction was dropped from the default roster;
  # TestPickRoleNotServedRejectionReason (pick_test.go) keeps covering the
  # mechanism itself with a synthetic thinker-only lane.
  - name: "executor role can land on gemini when it is the only lane with headroom"
    tags: ["personal"]
    role: executor
    now: "2026-09-24T10:00:00Z"
    signals:
      claude-personal: "2026-09-24T15:00:00Z"
      codex: "2026-09-24T15:00:00Z"
    capacity:
      - provider: "Google / Gemini"
        label: "5-hour"
        used_pct: 0
        headroom: 95
      - provider: "Google / Gemini"
        label: "7-day"
        used_pct: 0
        headroom: 95
    expect_lane: gemini
    expect_model: gemini-3.8-flash
    expect_rejected_contains: ["claude-personal", "signalled empty until"]

  # (l) Games task, everything empty except litellm -- games data is
  # allowed on litellm, so it's the last resort that actually wins.
  - name: "games task falls all the way through to litellm when every other lane is empty"
    tags: ["games"]
    role: executor
    now: "2026-09-24T10:00:00Z"
    signals:
      claude-personal: "2026-09-24T15:00:00Z"
      codex: "2026-09-24T15:00:00Z"
      proxy-model: "2026-09-24T15:00:00Z"
    capacity:
      - provider: "LiteLLM proxy"
        label: "spend"
        used_pct: 1
        headroom: 95
        is_spend: true
    expect_lane: litellm
    expect_model: claude-sonnet-5
    expect_rejected_contains: ["claude-personal", "codex", "proxy-model", "gemini"]

  # (m) Task #481's worked example: a code sweep on the personal plan
  # must come out as Sonnet on claude-personal, never Fable. Fable is not
  # an executor model on any lane (Validate refuses it), so with full
  # headroom the cheapest lane's executor entry is what wins.
  - name: "a code sweep on the personal plan resolves to Sonnet, never Fable"
    tags: ["project:aida", "sweep"]
    role: executor
    now: "2026-09-13T22:00:00Z"
    capacity:
      - provider: "Anthropic / Claude"
        label: "5-hour"
        used_pct: 10
        left_pct: 90
        headroom: 80
      - provider: "Anthropic / Claude"
        label: "7-day"
        used_pct: 40
        left_pct: 60
        headroom: 30
      - provider: "Anthropic / Claude"
        label: "7-day (Fable)"
        used_pct: 45
        left_pct: 55
        headroom: 5
    expect_lane: claude-personal
    expect_model: claude-sonnet-5
