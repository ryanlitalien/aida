name: Secrets scan

# Public-repo replacement for the private repo's scripts/oss-scan.sh, which
# is never published (it quotes the private strings it guards - see
# docs/fresh-start-cut.md). This runs gitleaks with its default ruleset only:
# no custom patterns, so this file itself is safe to publish. Dropped into
# the export tree by scripts/fresh-start-cut.sh in place of the oss-scan.sh
# CI step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
