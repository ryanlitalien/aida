# Burn-down floors config. Copy to ~/.aida/burndown.yaml and edit.
#
# Percent of each rate-limit window the burn-down must leave for Ryan's own
# interactive use. Static floors are the fallback; when a window has live pace
# data (internal/models/pace.go's PaceFor) the effective floor is derived from
# that pace instead -- see internal/burndown/capacity.go's CapacityFor for the
# exact rule. `aida burndown capacity` is the only thing that reads this file
# today; there is no scheduler yet, so nothing here is ever spent
# automatically.
#
# Values transcribed 2026-09-11 from
# docs/research/model-usage-burndown/data/recommendations.yaml's
# `window_floors:` block (a branch-only design doc, not part of this repo).
#
# `provider:` under each floors entry must match a provider's `label:` field
# in ~/.aida/models.yaml exactly (e.g. "Anthropic / Claude") -- that's how
# CapacityFor matches a live usage bar back to its floor. An entry with no
# matching provider, or a bar whose window this file doesn't name, is not an
# error: it just gets no floor and is reported as "no floor configured".

meta:
  compiled: 2026-09-11

floors:
  anthropic-max:
    provider: "Anthropic / Claude"
    windows:
      5h: {daytime: 30, overnight: 0}
      7d: {daytime: 30, last_24h_before_reset: 0, note: "weekly reset Fridays about 2pm ET per the 2026-09-11 probe"}
      7d-fable: {daytime: 50, overnight: 50, hard_floor: 50, note: "Fable is Ryan's interactive model; burn-down never takes it below half, any day"}
  anthropic-pro-bs:
    provider: "Anthropic / Claude Pro (ButterStack)"
    windows:
      5h: {daytime: 20, overnight: 0}
      7d: {daytime: 15, last_24h_before_reset: 0, note: "agent account; weekly reset Wednesdays about 4am ET"}
  openai-plus:
    provider: "OpenAI / ChatGPT + Codex"
    windows:
      5h: {daytime: 40, overnight: 0, note: "Ryan's interactive Astra and Sol come out of the same pool"}
      7d: {daytime: 25, last_24h_before_reset: 0, note: "weekly reset Wednesdays about 5pm ET"}
  google-ai-pro:
    provider: "Google / Gemini"
    # Antigravity's CLI is `agy` (internal/models/probe_agy.go), which is why its bars are labeled "... Gemini" / "... Claude/GPT" and Report excludes the Claude/GPT ones.
    windows:
      5h: {daytime: 30, overnight: 0}
      7d: {daytime: 20, last_24h_before_reset: 0}
      image: {daytime: 100, hard_floor: 100, note: "burn-down never touches the image bucket unless the task is game-assets"}
  litellm-keys:
    provider: "LiteLLM proxy (minty)"
    monthly: {floor_usd: 2, note: "minty-fleet and heimdall $10/30d keys; keep $2 for Jarvis and browser jobs"}
  bedrock-butterstack:
    # No live provider entry in ~/.aida/models.yaml yet (no Bedrock probe
    # wired up) -- kept here so it starts matching the moment one is added.
    monthly: {floor_usd: 15, note: "company money; a co-founder's agent runs share it"}

# Overnight is the window in which the burn-down runs unattended. A window
# whose reset lands before the end of this window (i.e. it resets before
# Ryan wakes) drains to a floor of 0, because anything left in it expires
# unused -- see CapacityFor's DrainToZero.
overnight:
  start: "23:00"
  end: "07:00"
  timezone: "America/New_York"

pace:
  # Safety multiplier applied to the pace-projected personal consumption
  # before it becomes a floor: additional = max(0, Pace.Projected - used%),
  # floor = additional * safety_multiplier, clamped between the window's
  # hard_floor (if any) and what's actually left.
  safety_multiplier: 1.25
